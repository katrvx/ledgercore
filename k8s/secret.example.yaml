# an example only: never commit a real password.
# create the real secret from the command line instead:
#   kubectl create secret generic ledgercore-secrets --from-literal=DATABASE_PASSWORD='...'
apiVersion: v1
kind: Secret
metadata:
  name: ledgercore-secrets
  labels:
    app: ledgercore
type: Opaque
stringData:
  DATABASE_PASSWORD: REPLACE_ME
