apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledgercore
  labels:
    app: ledgercore
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ledgercore
  template:
    metadata:
      labels:
        app: ledgercore
    spec:
      # longer than the app needs to stop, so kubernetes never has to kill it
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ledgercore
          # replace with the image pushed to your registry
          image: us-central1-docker.pkg.dev/PROJECT_ID/ledgercore/ledgercore:1.0.0
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: ledgercore-config
            - secretRef:
                name: ledgercore-secrets
          resources:
            requests:
              cpu: 500m
              memory: 768Mi
            # a memory limit protects the node, the heap is 75% of it (see JAVA_OPTS in the Dockerfile)
            # no cpu limit on purpose: a limit throttles the jvm in short bursts and makes latency worse
            limits:
              memory: 768Mi
          # the jvm and the flyway migration take a few seconds, liveness only starts after this passes
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 30
          # no traffic while the database is unreachable; the pool gives up after 5 s, so 6 s is enough
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 6
            failureThreshold: 2
          # /health never touches the database, so an outage there doesn't restart every pod
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # the pod leaves the service and gets SIGTERM at the same moment, so wait for the last requests
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # the root filesystem is read-only, the jvm and jetty write their temp files here
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
