openapi: 3.1.0
info:
  title: LedgerCore
  version: 0.1.0
  description: |
    Accounts and money transfers with double-entry bookkeeping. All amounts are in minor units (for example cents for EUR).
    Every response has an X-Request-Id header. It is the X-Request-Id sent by the client when that is 1 to 64 letters,
    digits, dots, underscores or dashes, otherwise a new UUID. The same id is in every log line about the request and
    in every problem body. Every error is application/problem+json (RFC 9457, which replaced RFC 7807),
    including unknown routes (404).
    A wrong method on a known path is also a 404. POST bodies must be application/json and at most 16384 bytes.
    A JSON body with the same field twice is rejected with 400.
    When the database can't be reached, every endpoint except /health answers 503 with a Retry-After header.

servers:
  - url: http://localhost:8080

# v1 has no authentication
security: []

paths:
  /health:
    get:
      operationId: health
      summary: Liveness check, does not touch the database
      responses:
        "500":
          $ref: "#/components/responses/InternalError"
        "200":
          description: The process is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"

  /ready:
    get:
      operationId: ready
      summary: Readiness check, fails only when the database is not reachable
      description: Without Redis the service still works, only the idempotency fast path is gone, so a Redis outage is reported but does not fail readiness.
      responses:
        "500":
          $ref: "#/components/responses/InternalError"
        "200":
          description: Ready to take traffic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          description: The database is not reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"

  /accounts:
    post:
      operationId: createAccount
      summary: Open a customer account with a zero balance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccountRequest"
      responses:
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "201":
          description: Account created
          headers:
            Location:
              description: Path of the new account
              schema:
                type: string
                example: /accounts/42
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          $ref: "#/components/responses/ContentTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"

  /accounts/{id}:
    get:
      operationId: getAccount
      summary: Get one customer account
      description: System funding accounts are internal. Asking for one answers 404, like an account that does not exist.
      parameters:
        - $ref: "#/components/parameters/AccountId"
      responses:
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "200":
          description: The account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /accounts/{id}/transactions:
    get:
      operationId: listTransactions
      summary: History of an account, newest first, one page at a time
      description: |
        Each item is one ledger entry of the account: negative when money left it, positive when money came in.
        Only completed transfers have ledger entries, so transfers in review or declined are not listed.
        Pages use a cursor: pass nextCursor from the previous page to get the next one. New transfers made
        between two requests don't shift or repeat entries on later pages.
      parameters:
        - $ref: "#/components/parameters/AccountId"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          required: false
          description: Opaque value from nextCursor of the previous page
          schema:
            type: string
      responses:
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "200":
          description: One page of the account history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /accounts/{id}/deposits:
    post:
      operationId: deposit
      summary: Add money to a customer account
      description: A deposit is a transfer from the system funding account of the account's currency, so it gets the same locking, ledger entries and idempotency as any transfer. Deposits are money from outside and are not checked by the fraud rules.
      parameters:
        - $ref: "#/components/parameters/AccountId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepositRequest"
      responses:
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "201":
          description: Deposit completed, or the saved response of the first request with this key
          headers:
            Location:
              description: Path of the transfer that moved the money
              schema:
                type: string
                example: /transfers/7
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transfer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          $ref: "#/components/responses/ContentTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /transfers:
    post:
      operationId: createTransfer
      summary: Move money between two customer accounts of the same currency
      description: |
        Every transfer is checked by fraud rules before any money moves. The result is 201 (completed),
        202 (saved as PENDING_REVIEW, no money moved) or 422 (declined and kept for audit). The response never
        says which rule fired.
        Retries with the same Idempotency-Key get the saved response of the first request, including a saved 202, 404 or 422.
        The rules are not run again for a retry. A 400 is not saved, so the key can be reused with a fixed body.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTransferRequest"
      responses:
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "201":
          description: Transfer completed, or the saved response of the first request with this key
          headers:
            Location:
              description: Path of the new transfer
              schema:
                type: string
                example: /transfers/7
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transfer"
        "202":
          description: Flagged by the fraud rules and saved as PENDING_REVIEW. No money moved.
          headers:
            Location:
              description: Path of the saved transfer
              schema:
                type: string
                example: /transfers/8
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transfer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          $ref: "#/components/responses/ContentTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          description: |
            The request breaks a business rule, for example insufficient funds, different currencies or an
            Idempotency-Key reused with a different request. It is also returned with the detail
            "transfer was declined by risk checks" when the fraud rules decline the transfer.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /transfers/{id}:
    get:
      operationId: getTransfer
      summary: Get one transfer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "200":
          description: The transfer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transfer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  parameters:
    AccountId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Unique per request, for example a UUID, made of visible ASCII characters only. The same key with the same method, path and JSON body
        (field order and whitespace do not matter) replays the first response. The same key with a
        different request is rejected with 422. A key is kept for 24 hours in Redis and permanently in the database.
      schema:
        type: string
        minLength: 1
        maxLength: 255
        example: 6f1c2a3e-8b4d-4c5e-9f0a-1b2c3d4e5f60

  schemas:
    Status:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [UP]

    Readiness:
      type: object
      required: [status, database, redis]
      properties:
        status:
          type: string
          enum: [UP, DOWN]
          description: DOWN only when the database is not reachable
        database:
          type: string
          enum: [UP, DOWN]
        redis:
          type: string
          enum: [UP, DOWN, DISABLED]
          description: DISABLED when REDIS_URL is not set. The service then uses the database for idempotency and the velocity rule.

    CreateAccountRequest:
      type: object
      additionalProperties: false
      required: [ownerName, currency]
      properties:
        ownerName:
          type: string
          minLength: 1
          maxLength: 200
          description: Trimmed before saving. Control characters are not allowed.
          example: Alice
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
          description: ISO 4217 code. Only EUR, GBP and USD are supported.
          example: EUR

    Account:
      type: object
      required: [id, type, ownerName, currency, balance, createdAt]
      properties:
        id:
          type: integer
          format: int64
          example: 42
        type:
          type: string
          enum: [CUSTOMER, SYSTEM]
          description: SYSTEM accounts are the funding accounts money enters from. Only they can have a negative balance.
        ownerName:
          type: string
          example: Alice
        currency:
          type: string
          example: EUR
        balance:
          type: integer
          format: int64
          description: Balance in minor units
          example: 0
        createdAt:
          type: string
          format: date-time
          description: Always in UTC
          example: "2026-09-26T10:20:56.003403Z"

    LedgerEntry:
      type: object
      required: [entryId, transferId, counterpartyAccountId, amount, currency, createdAt]
      properties:
        entryId:
          type: integer
          format: int64
          example: 311
        transferId:
          type: integer
          format: int64
          example: 7
        counterpartyAccountId:
          type: integer
          format: int64
          description: The account on the other side of the transfer
          example: 43
        amount:
          type: integer
          format: int64
          description: Signed amount in minor units, negative when money left the account
          example: -2500
        currency:
          type: string
          example: EUR
        createdAt:
          type: string
          format: date-time
          description: Always in UTC
          example: "2026-09-26T10:21:03.118220Z"

    TransactionPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/LedgerEntry"
        nextCursor:
          type: [string, "null"]
          description: Cursor for the next page, null on the last page
          example: MzEx

    DepositRequest:
      type: object
      additionalProperties: false
      required: [amount]
      properties:
        amount:
          type: integer
          format: int64
          minimum: 1
          description: Amount in minor units of the account currency
          example: 10000

    CreateTransferRequest:
      type: object
      additionalProperties: false
      required: [fromAccountId, toAccountId, amount, currency]
      properties:
        fromAccountId:
          type: integer
          format: int64
          minimum: 1
          example: 42
        toAccountId:
          type: integer
          format: int64
          minimum: 1
          example: 43
        amount:
          type: integer
          format: int64
          minimum: 1
          description: Amount in minor units. Must be a whole number, "100" and 100.5 are rejected.
          example: 2500
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
          description: Must match the currency of both accounts. Cross-currency transfers are rejected with 422.
          example: EUR

    Transfer:
      type: object
      required: [id, fromAccountId, toAccountId, amount, currency, status, createdAt]
      properties:
        id:
          type: integer
          format: int64
          example: 7
        fromAccountId:
          type: integer
          format: int64
          example: 42
        toAccountId:
          type: integer
          format: int64
          example: 43
        amount:
          type: integer
          format: int64
          example: 2500
        currency:
          type: string
          example: EUR
        status:
          type: string
          enum: [COMPLETED, PENDING_REVIEW, DECLINED]
          description: PENDING_REVIEW and DECLINED transfers moved no money and have no ledger entries.
        createdAt:
          type: string
          format: date-time
          description: Always in UTC
          example: "2026-09-26T10:21:03.118220Z"

    Problem:
      type: object
      description: Error body from RFC 9457, which replaced RFC 7807
      required: [type, title, status, detail]
      properties:
        type:
          type: string
          example: about:blank
        title:
          type: string
          example: Bad Request
        status:
          type: integer
          example: 400
        detail:
          type: string
          example: currency JPY is not supported
        requestId:
          type: string
          description: Id of the request that produced this problem, for support. Saved idempotent responses are replayed exactly as they were first sent, so they don't have it.
          example: 7f0c2f4e-3b1a-4d7e-9a61-2f1c9d3e8b10

  responses:
    BadRequest:
      description: The request is not valid, for example a missing field or a missing Idempotency-Key header
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: The resource does not exist
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: A request with the same Idempotency-Key is still being handled, retry in a moment
      headers:
        Retry-After:
          description: Seconds to wait before the retry
          schema:
            type: integer
            example: 1
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ContentTooLarge:
      description: The request body is larger than 16384 bytes
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnsupportedMediaType:
      description: The request body is not sent as application/json (parameters like charset and any letter case are fine)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ServiceUnavailable:
      description: The database can't be reached right now. Nothing was changed, so the request can be sent again.
      headers:
        Retry-After:
          description: Seconds to wait before the retry
          schema:
            type: integer
            example: 1
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InternalError:
      description: A bug on our side. The body only says "internal error" and gives the requestId, the details are in our logs.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unprocessable:
      description: The request is well formed but breaks a business rule, for example insufficient funds, different currencies, or an Idempotency-Key reused with a different request
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
