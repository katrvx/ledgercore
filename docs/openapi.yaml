openapi: 3.1.0
info:
  title: LedgerCore
  version: 0.1.0
  description: Accounts and money transfers with double-entry bookkeeping. All amounts are in minor units (for example cents for EUR).

servers:
  - url: http://localhost:8080

# v1 has no authentication
security: []

paths:
  /health:
    get:
      operationId: health
      summary: Liveness check, does not touch the database
      responses:
        "200":
          description: The process is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"

  /ready:
    get:
      operationId: ready
      summary: Readiness check, fails when the database is not reachable
      responses:
        "200":
          description: Ready to take traffic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        "503":
          description: The database is not reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"

  /accounts:
    post:
      operationId: createAccount
      summary: Open a customer account with a zero balance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccountRequest"
      responses:
        "201":
          description: Account created
          headers:
            Location:
              description: Path of the new account
              schema:
                type: string
                example: /accounts/42
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/BadRequest"

  /accounts/{id}:
    get:
      operationId: getAccount
      summary: Get one account
      parameters:
        - $ref: "#/components/parameters/AccountId"
      responses:
        "200":
          description: The account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /accounts/{id}/deposits:
    post:
      operationId: deposit
      summary: Add money to a customer account
      description: A deposit is a transfer from the system funding account of the account's currency, so it gets the same locking and ledger entries as any transfer.
      parameters:
        - $ref: "#/components/parameters/AccountId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepositRequest"
      responses:
        "201":
          description: Deposit completed
          headers:
            Location:
              description: Path of the transfer that moved the money
              schema:
                type: string
                example: /transfers/7
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transfer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /transfers:
    post:
      operationId: createTransfer
      summary: Move money between two customer accounts of the same currency
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTransferRequest"
      responses:
        "201":
          description: Transfer completed
          headers:
            Location:
              description: Path of the new transfer
              schema:
                type: string
                example: /transfers/7
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transfer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /transfers/{id}:
    get:
      operationId: getTransfer
      summary: Get one transfer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: The transfer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transfer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  parameters:
    AccountId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1

  schemas:
    Status:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [UP, DOWN]

    CreateAccountRequest:
      type: object
      additionalProperties: false
      required: [ownerName, currency]
      properties:
        ownerName:
          type: string
          minLength: 1
          maxLength: 200
          description: Trimmed before saving. Control characters are not allowed.
          example: Alice
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
          description: ISO 4217 code. Only EUR, GBP and USD are supported.
          example: EUR

    Account:
      type: object
      required: [id, type, ownerName, currency, balance, createdAt]
      properties:
        id:
          type: integer
          format: int64
          example: 42
        type:
          type: string
          enum: [CUSTOMER, SYSTEM]
          description: SYSTEM accounts are the funding accounts money enters from. Only they can have a negative balance.
        ownerName:
          type: string
          example: Alice
        currency:
          type: string
          example: EUR
        balance:
          type: integer
          format: int64
          description: Balance in minor units
          example: 0
        createdAt:
          type: string
          format: date-time
          description: Always in UTC
          example: "2026-09-26T10:20:56.003403Z"

    DepositRequest:
      type: object
      additionalProperties: false
      required: [amount]
      properties:
        amount:
          type: integer
          format: int64
          minimum: 1
          description: Amount in minor units of the account currency
          example: 10000

    CreateTransferRequest:
      type: object
      additionalProperties: false
      required: [fromAccountId, toAccountId, amount, currency]
      properties:
        fromAccountId:
          type: integer
          format: int64
          minimum: 1
          example: 42
        toAccountId:
          type: integer
          format: int64
          minimum: 1
          example: 43
        amount:
          type: integer
          format: int64
          minimum: 1
          description: Amount in minor units. Must be a whole number, "100" and 100.5 are rejected.
          example: 2500
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
          description: Must match the currency of both accounts. Cross-currency transfers are rejected with 422.
          example: EUR

    Transfer:
      type: object
      required: [id, fromAccountId, toAccountId, amount, currency, status, createdAt]
      properties:
        id:
          type: integer
          format: int64
          example: 7
        fromAccountId:
          type: integer
          format: int64
          example: 42
        toAccountId:
          type: integer
          format: int64
          example: 43
        amount:
          type: integer
          format: int64
          example: 2500
        currency:
          type: string
          example: EUR
        status:
          type: string
          enum: [COMPLETED]
        createdAt:
          type: string
          format: date-time
          description: Always in UTC
          example: "2026-09-26T10:21:03.118220Z"

    Problem:
      type: object
      description: Error body from RFC 7807
      required: [type, title, status, detail]
      properties:
        type:
          type: string
          example: about:blank
        title:
          type: string
          example: Bad Request
        status:
          type: integer
          example: 400
        detail:
          type: string
          example: currency JPY is not supported

  responses:
    BadRequest:
      description: The request is not valid
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: The resource does not exist
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unprocessable:
      description: The request is well formed but breaks a business rule, for example insufficient funds or different currencies
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
