services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ledgercore}
      POSTGRES_USER: ${POSTGRES_USER:-ledgercore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ledgercore}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ledgercore}
      DATABASE_USER: ${POSTGRES_USER:-ledgercore}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-ledgercore}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # same as in kubernetes: nothing on the image can be changed, only /tmp is writable
    read_only: true
    tmpfs:
      - /tmp

volumes:
  postgres-data:
