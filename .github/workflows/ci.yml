name: ci

on:
  push:
    branches: [main]
  pull_request:

# the workflow only reads the code, it never pushes or comments
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew check

      # the docs must match the code: the api description must be valid, the fraud report must not be stale
      - name: validate the openapi description
        run: npx --yes @redocly/cli@2.54.3 lint docs/openapi.yaml
      - name: check that the fraud report matches the rules
        run: |
          ./gradlew fraudEvaluation
          git diff --exit-code docs/fraud-evaluation.md

      # the image and the kubernetes manifests are only used at deploy time, so check them on every push too
      - name: build the docker image
        run: docker build -t ledgercore .
      - name: validate the kubernetes manifests
        run: docker run --rm -v "$PWD/k8s:/k8s:ro" ghcr.io/yannh/kubeconform:v0.8.0 -strict -summary /k8s

      # the html report for reading, the xml results because they keep each test's output and server logs
      - name: upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/test/
          retention-days: 14
