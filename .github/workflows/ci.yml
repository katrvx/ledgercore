name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew check

      # the image and the kubernetes manifests are only used at deploy time, so check them on every push too
      - name: build the docker image
        run: docker build -t ledgercore .
      - name: validate the kubernetes manifests
        run: docker run --rm -v "$PWD/k8s:/k8s:ro" ghcr.io/yannh/kubeconform:v0.8.0 -strict -summary /k8s

      # the html report for reading, the xml results because they keep each test's output and server logs
      - name: upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/test/
          retention-days: 14
